<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>osci//log · Reel „Von Newton bis Ohm"</title>
<!-- Bild-Engine: zeichnet jeden Frame deterministisch aus der Zeit t und den Daten des Tracks (data.js aus track.py).
     Acht Größen, je ein Takt, Vollbild: das Wort knallt auf die Kick rein, die Formel schreibt sich mit Stift, das Diagramm
     füllt den Schirm. Kamera zoomt langsam, Scanlines und Vignette liegen drüber, unten läuft die echte Wellenform.
     Die Elektronen in „Ladung" und „Strom" sind die Blips und Arpeggio-Noten, die man hört. Rendern: render.js. -->
<style>
@font-face { font-family: 'Meslo'; src: url('../../assets/fonts/meslo-lgs-nf-regular.woff') format('woff'); font-weight: 400; }
@font-face { font-family: 'Meslo'; src: url('../../assets/fonts/meslo-lgs-nf-bold.woff') format('woff'); font-weight: 700; }
html, body { margin: 0; background: #333; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const INK = '#0a0a14', CHALK = '#efece2', BLUE = '#1a12ff', KUPFER = '#ff5a2e', KUPFER_HELL = '#ff4a1c', AMP = '#9096ff', AMP_HELL = '#1a12ff',
      PANEL = '#12121f', HAIR = '#3a3a4c', MUTED = '#b5b2a8', MUTED_HELL = '#57554f', PAPIER = '#f6f4ec';
const zpi = Math.PI * 2;
let D = null;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 2);
const easeIO = x => { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const pop = x => { x = clamp(x); return 1 + 0.35 * Math.sin(x * Math.PI) * (1 - x); };
const lerp = (a, b, x) => a + (b - a) * x;
const sec = (bar, beat = 0, step = 0) => (bar - 1) * D.bar + beat * D.beat + step * D.beat / 4;
const frameOf = t => clamp(Math.floor(t * D.fps), 0, D.rms.length - 1);
const kickEnv = t => clamp((1 - D.sc[frameOf(t)]) / 0.85);
const rmsAt = t => D.rms[frameOf(t)];
const beatPhase = t => (t / D.beat) % 1;
const since = (list, t) => { let s = 9; for (const x of list) { if (x <= t) s = t - x; else break; } return s; };

/* Farben je Hintergrund: Kupfer ist Spannung, Blau ist Strom */
const PAL = {
  chalk: {bg: CHALK, fg: INK, muted: MUTED_HELL, volt: KUPFER_HELL, amp: AMP_HELL, card: PAPIER, line: 'rgba(10,10,20,.12)', label: [INK, CHALK], dark: false},
  ink:   {bg: INK, fg: CHALK, muted: MUTED, volt: KUPFER, amp: AMP, card: PANEL, line: 'rgba(239,236,226,.08)', label: [CHALK, INK], dark: true},
  blue:  {bg: BLUE, fg: CHALK, muted: '#dcd9ff', volt: KUPFER, amp: CHALK, card: '#1208c4', line: 'rgba(239,236,226,.12)', label: [CHALK, BLUE], dark: true}
};

/* ---------- Zeichenhelfer ---------- */
function bg(color) { ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); }
function font(size, weight = 400, ls = 0) { ctx.font = `${weight} ${size}px Meslo`; ctx.letterSpacing = ls + 'px'; }
function text(s, x, y, o = {}) {
  font(o.size || 24, o.weight || 400, o.ls || 0);
  ctx.fillStyle = o.color || CHALK; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic';
  ctx.fillText(s, x, y); ctx.letterSpacing = '0px';
}
function textW(s, size, weight = 400, ls = 0) { font(size, weight, ls); const w = ctx.measureText(s).width; ctx.letterSpacing = '0px'; return w; }
function eyebrow(s, x, y, p, o = {}) {
  const size = o.size || 22, h = size * 1.9; s = s.toUpperCase();
  const w = textW(s, size, 700, 1) + 40;
  ctx.fillStyle = o.bg || p.label[0]; ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + w - 14, y); ctx.lineTo(x + w, y + h / 2); ctx.lineTo(x + w - 14, y + h); ctx.lineTo(x, y + h); ctx.closePath(); ctx.fill();
  text(s, x + 14, y + h / 2 + 1, {size, weight: 700, ls: 1, color: o.fg || p.label[1], base: 'middle'});
  return w;
}
function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
function noglow() { ctx.shadowBlur = 0; }
function lissajous(x, y, size, lw, color, a = 3, b = 2, phase = 0) {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.beginPath();
  const n = 300, r = size / 2;
  for (let i = 0; i <= n; i++) { const th = i / n * zpi; const px = x + r * Math.cos(a * th + phase), py = y + r * Math.sin(b * th); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.stroke();
}
function logo(x, y, s, lw) { ctx.fillStyle = BLUE; ctx.fillRect(x, y, s, s); lissajous(x + s / 2, y + s / 2, s * .72, lw, CHALK); }
function brand(p, x = 80, y = 236) { logo(x, y - 30, 44, 3.6); text('osci//log', x + 58, y, {size: 26, weight: 700, ls: -0.8, color: p.fg}); }
function arrow(x1, y1, x2, y2, color, lw = 5, head = 18, leuchten = false) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  if (leuchten) glow(color, 18);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * head * .6, y2 - Math.sin(a) * head * .6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - head * Math.cos(a - .5), y2 - head * Math.sin(a - .5)); ctx.lineTo(x2 - head * Math.cos(a + .5), y2 - head * Math.sin(a + .5)); ctx.closePath(); ctx.fill();
  noglow();
}
function dashed(x1, y1, x2, y2, color, lw = 2, dash = [8, 10]) { ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]); }
function dot(x, y, r, color, leuchten = true) { if (leuchten) glow(color, 22); ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, zpi); ctx.fill(); noglow(); }
function knopf(s, x, y, w, h, fill, border, color, size = 28) {
  if (fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
  ctx.strokeStyle = border; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  text(s, x + w / 2, y + h / 2 + 1, {size, weight: 700, color, align: 'center', base: 'middle'});
}
/* Signalfenster der Mix-Spur */
function win(name, t, ms) {
  const sig = D.sig[name], n = Math.round(ms / 1000 * D.sr), end = clamp(Math.round(t * D.sr), n, sig.length), out = new Float32Array(n);
  for (let i = 0; i < n; i++) out[i] = sig[end - n + i] / 32767;
  return out;
}

/* ---------- Haut: Textur, Scanlines, Vignette, Kick-Flash, Wellenform ---------- */
function textur(p, t) {
  if (p.bg === BLUE) { ctx.save(); ctx.strokeStyle = '#2a22ff'; ctx.lineWidth = 3; ctx.beginPath(); const off = (t * 30) % 22; for (let d = -H; d < W + H; d += 22) { ctx.moveTo(d + off, 0); ctx.lineTo(d + off - H, H); } ctx.stroke(); ctx.restore(); return; }
  ctx.strokeStyle = p.line; ctx.lineWidth = 1; ctx.beginPath(); const off = (t * 9) % 72;
  for (let x = -72 + off; x < W; x += 72) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -72 + off; y < H; y += 72) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
}
function haut(p, t) {
  /* Kick-Flash */
  const k = kickEnv(t); ctx.fillStyle = p.dark ? `rgba(239,236,226,${.07 * k})` : `rgba(10,10,20,${.05 * k})`; ctx.fillRect(0, 0, W, H);
  /* Scanlines */
  ctx.fillStyle = p.dark ? 'rgba(0,0,0,.16)' : 'rgba(10,10,20,.045)'; for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1.2);
  /* Vignette */
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .72); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, p.dark ? 'rgba(0,0,0,.45)' : 'rgba(10,10,20,.14)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function welle(p, t, y = 1700) {
  const s = win('mix', t, 60); glow(p.volt, 14); ctx.strokeStyle = p.volt; ctx.lineWidth = 2.5; ctx.globalAlpha = .85; ctx.lineJoin = 'round'; ctx.beginPath();
  for (let i = 0; i < s.length; i++) { const x = i / (s.length - 1) * W, yy = y - s[i] * 70; i ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); }
  ctx.stroke(); ctx.globalAlpha = 1; noglow();
}
/* Kamera: langsamer Zoom je Takt, kurzer Ruck auf die Snare, Slide-in beim Schnitt */
function kamera(t, t0, dauer) {
  const u = clamp((t - t0) / dauer), s = 1 + .05 * u, sn = since(D.snare, t), ruck = sn < .07 ? (1 - sn / .07) * 4 : 0;
  const slide = 70 * (1 - ease((t - t0) / .28));
  ctx.translate(W / 2 + ruck * Math.sin(t * 240), H / 2 + slide); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2);
}

/* ---------- Formeln: Token-Liste → Breite / Zeichnung ---------- */
function fmlWidth(tokens, size) {
  let w = 0;
  for (const tk of tokens) {
    if (typeof tk === 'string') w += textW(tk, size, 700, -size * .04);
    else if (tk.t !== undefined) w += textW(tk.t, size, 700, -size * .04);
    else if (tk.sub !== undefined || tk.sup !== undefined) w += textW(tk.sub ?? tk.sup, size * .55, 700) + size * .04;
    else if (tk.frac) w += Math.max(fmlWidth(tk.frac[0], size * .74), fmlWidth(tk.frac[1], size * .74)) + size * .3;
    else if (tk.sp) w += tk.sp * size;
  }
  return w;
}
function fmlDraw(tokens, x, y, size, color) {
  let cx = x;
  for (const tk of tokens) {
    if (typeof tk === 'string' || tk.t !== undefined) { const s = typeof tk === 'string' ? tk : tk.t; text(s, cx, y, {size, weight: 700, ls: -size * .04, color: tk.c || color}); cx += textW(s, size, 700, -size * .04); }
    else if (tk.sub !== undefined) { text(tk.sub, cx + size * .02, y + size * .16, {size: size * .55, weight: 700, color: tk.c || color}); cx += textW(tk.sub, size * .55, 700) + size * .04; }
    else if (tk.sup !== undefined) { text(tk.sup, cx + size * .02, y - size * .5, {size: size * .55, weight: 700, color: tk.c || color}); cx += textW(tk.sup, size * .55, 700) + size * .04; }
    else if (tk.frac) {
      const s2 = size * .74, wn = fmlWidth(tk.frac[0], s2), wd = fmlWidth(tk.frac[1], s2), w = Math.max(wn, wd) + size * .3;
      fmlDraw(tk.frac[0], cx + (w - wn) / 2, y - size * .56, s2, color); fmlDraw(tk.frac[1], cx + (w - wd) / 2, y + size * .5, s2, color);
      ctx.fillStyle = tk.c || color; ctx.fillRect(cx + size * .06, y - size * .36, w - size * .12, Math.max(3, size * .05)); cx += w;
    }
    else if (tk.sp) cx += tk.sp * size;
  }
}
function fmlWrite(tokens, x, y, size, color, prog, pen = KUPFER) {
  const w = fmlWidth(tokens, size); prog = clamp(prog);
  ctx.save(); ctx.beginPath(); ctx.rect(x - 10, y - size * 1.3, w * prog + 12, size * 2.6); ctx.clip(); fmlDraw(tokens, x, y, size, color); ctx.restore();
  if (prog > 0 && prog < 1) { glow(pen, 26); ctx.fillStyle = pen; ctx.beginPath(); ctx.arc(x + w * prog, y - size * .3, size * .1, 0, zpi); ctx.fill(); noglow(); }
  return w;
}
function textWrite(s, x, y, size, color, prog, pen = KUPFER, ls = -size * .06) {
  const w = textW(s, size, 700, ls); prog = clamp(prog);
  ctx.save(); ctx.beginPath(); ctx.rect(x - 10, y - size * 1.1, w * prog + 12, size * 1.5); ctx.clip(); text(s, x, y, {size, weight: 700, ls, color}); ctx.restore();
  if (prog > 0 && prog < 1) { glow(pen, 26); ctx.fillStyle = pen; ctx.beginPath(); ctx.arc(x + w * prog, y - size * .32, size * .09, 0, zpi); ctx.fill(); noglow(); }
}
/* Das Wort knallt rein: von groß nach klein mit Überschwingen, dazu Buchstabenabstand von weit nach eng */
function slam(s, x, y, size, color, t, t0) {
  const u = clamp((t - t0) / .26), f = back(u); if (u <= 0) return;
  const sc = lerp(1.9, 1, f), ls = lerp(size * .12, -size * .06, f);
  ctx.save(); ctx.globalAlpha = clamp(u * 3); ctx.translate(x, y); ctx.scale(sc, sc); text(s, 0, 0, {size, weight: 700, ls, color}); ctx.restore();
}

/* ---------- Die acht Größen ---------- */
const GROESSEN = [
  {name: 'Kraft', sym: 'F', unit: 'N', satz: 'Kraft ändert Bewegung.', bg: 'ink', f: p => ['F', {sp: .25}, '=', {sp: .25}, 'm', {sp: .15}, '·', {sp: .15}, 'a']},
  {name: 'Arbeit', sym: 'W', unit: 'J', satz: 'Kraft mal Weg: die Energie, die ankommt.', bg: 'chalk', f: p => ['W', {sp: .25}, '=', {sp: .25}, 'F', {sp: .15}, '·', {sp: .15}, 's']},
  {name: 'Ladung', sym: 'Q', unit: 'C', satz: 'Ladung kommt in Portionen — e = 1,602 · 10⁻¹⁹ C.', bg: 'ink', f: p => [{t: 'Q', c: p.amp}, {sp: .25}, '=', {sp: .25}, 'n', {sp: .15}, '·', {sp: .15}, 'e']},
  {name: 'Feld', sym: 'E', unit: 'V/m', satz: 'Kraft pro Ladung. Das Feld ist da, auch ohne q.', bg: 'blue', f: p => [{t: 'E', c: p.volt}, {sp: .25}, '=', {sp: .25}, {frac: [['F'], [{t: 'q', c: p.amp}]]}]},
  {name: 'Potential', sym: 'φ', unit: 'V', satz: 'Energie pro Ladung ist eine Höhe. Ladung rollt bergab.', bg: 'ink', f: p => [{t: 'φ', c: p.volt}, {sp: .25}, '=', {sp: .25}, {frac: [['E', {sub: 'pot'}], [{t: 'q', c: p.amp}]]}]},
  {name: 'Spannung', sym: 'U', unit: 'V', satz: 'Nur der Unterschied zählt. Masse ist frei wählbar.', bg: 'blue', f: p => [{t: 'U', c: p.volt}, {sp: .25}, '=', {sp: .25}, 'φ', {sub: '1'}, {sp: .15}, '−', {sp: .15}, 'φ', {sub: '2'}]},
  {name: 'Strom', sym: 'I', unit: 'A', satz: 'Ladung pro Zeit durch den Querschnitt.', bg: 'chalk', f: p => [{t: 'I', c: p.amp}, {sp: .25}, '=', {sp: .25}, {frac: [['d', {t: 'Q', c: p.amp}], ['dt']]}]},
  {name: 'Widerstand', sym: 'R', unit: 'Ω', satz: 'Beschleunigen, stoßen, von vorn. Newton im Draht.', bg: 'ink', f: p => ['R', {sp: .25}, '=', {sp: .25}, {frac: [[{t: 'U', c: p.volt}], [{t: 'I', c: p.amp}]]}]}
];

/* Die Kette: acht Kästen in zwei Reihen, Leiterbahn dazwischen */
const KETTE = {x: 80, w: 200, h: 170, gap: 40, y1: 880, y2: 1230};
function kettePos(i) { const r = i < 4 ? 0 : 1, c = i % 4; return {x: KETTE.x + c * (KETTE.w + KETTE.gap), y: r ? KETTE.y2 : KETTE.y1}; }
function kette(t, p, o) {
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const a = o.sichtbar(i); if (a <= 0) continue;
    const {x, y} = kettePos(i), s = pop(a);
    ctx.save(); ctx.translate(x + KETTE.w / 2, y + KETTE.h / 2); ctx.scale(s, s); ctx.translate(-(x + KETTE.w / 2), -(y + KETTE.h / 2)); ctx.globalAlpha = clamp(a * 2);
    if (o.gefuellt) { ctx.fillStyle = p.card; ctx.fillRect(x, y, KETTE.w, KETTE.h); }
    ctx.strokeStyle = p.fg; ctx.strokeRect(x + 1, y + 1, KETTE.w - 2, KETTE.h - 2);
    text(String(i + 1).padStart(2, '0'), x + 12, y + 28, {size: 16, color: p.muted, ls: 1});
    if (o.gefuellt) {
      glow(i === 5 ? p.volt : i === 6 ? p.amp : 'transparent', 14);
      text(GROESSEN[i].sym, x + KETTE.w / 2, y + 96, {size: 66, weight: 700, color: i === 5 ? p.volt : i === 6 ? p.amp : p.fg, align: 'center'}); noglow();
      text(GROESSEN[i].name, x + KETTE.w / 2, y + 128, {size: 17, color: p.fg, align: 'center'});
      text(GROESSEN[i].unit, x + KETTE.w / 2, y + 156, {size: 17, weight: 700, color: p.fg, align: 'center'});
    } else text('?', x + KETTE.w / 2, y + 112, {size: 66, weight: 700, color: p.muted, align: 'center'});
    ctx.restore();
  }
  ctx.strokeStyle = 'rgba(239,236,226,.35)'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
  for (let i = 0; i < 7; i++) {
    const a = Math.min(o.sichtbar(i), o.sichtbar(i + 1)); if (a <= 0) continue;
    const A = kettePos(i), B = kettePos(i + 1); ctx.globalAlpha = clamp(a * 2); ctx.beginPath();
    const ym = KETTE.y1 + KETTE.h + (KETTE.y2 - KETTE.y1 - KETTE.h) / 2;
    if (i !== 3) { ctx.moveTo(A.x + KETTE.w, A.y + KETTE.h / 2); ctx.lineTo(B.x, B.y + KETTE.h / 2); }
    else { ctx.moveTo(A.x + KETTE.w / 2, A.y + KETTE.h); ctx.lineTo(A.x + KETTE.w / 2, ym); ctx.lineTo(B.x + KETTE.w / 2, ym); ctx.lineTo(B.x + KETTE.w / 2, B.y); }
    ctx.stroke();
    if (o.laufen) { const u = beatPhase(t);
      if (i !== 3) dot(lerp(A.x + KETTE.w, B.x, u), A.y + KETTE.h / 2, 7, p.volt);
      else { const L1 = ym - (A.y + KETTE.h), L2 = A.x - B.x, L3 = B.y - ym, L = L1 + L2 + L3, d = u * L;
        if (d < L1) dot(A.x + KETTE.w / 2, A.y + KETTE.h + d, 7, p.volt); else if (d < L1 + L2) dot(A.x + KETTE.w / 2 - (d - L1), ym, 7, p.volt); else dot(B.x + KETTE.w / 2, ym + (d - L1 - L2), 7, p.volt); } }
  }
  ctx.globalAlpha = 1;
}
/* Schmale Fortschrittsleiste oben, die Hats ticken sie an */
function fortschritt(aktiv, p, t) {
  const hat = since(D.hat, t);
  for (let i = 0; i < 8; i++) {
    const x = 80 + i * 116, w = 108, y = 300;
    ctx.fillStyle = i < aktiv ? p.fg : i === aktiv ? p.volt : p.line; if (i === aktiv) glow(p.volt, 12);
    ctx.fillRect(x, y, i === aktiv ? w * clamp((t - sec(3 + aktiv)) / D.bar) : w, 6 + (i === aktiv && hat < .08 ? 3 : 0)); noglow();
    if (i === aktiv) { ctx.fillStyle = p.line; ctx.fillRect(x + w * clamp((t - sec(3 + aktiv)) / D.bar), y, w * (1 - clamp((t - sec(3 + aktiv)) / D.bar)), 6); }
  }
  text(`${String(aktiv + 1).padStart(2, '0')} / 08`, 1000, 282, {size: 20, color: p.muted, align: 'right', ls: 2});
}

/* ---------- Diagramme, Vollbild: (t, u, p, r = Bereich) ---------- */
const DIAGRAMME = [
  /* Kraft */
  (t, u, p, r) => {
    const y0 = r.y + r.h * .72, k = kickEnv(t);
    ctx.strokeStyle = p.muted; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(r.x, y0); ctx.lineTo(r.x + r.w, y0); ctx.stroke();
    const x = r.x + 200 + 460 * easeIn(u), s = 220;
    ctx.fillStyle = p.card; ctx.fillRect(x, y0 - s, s, s); ctx.strokeStyle = p.fg; ctx.lineWidth = 4; ctx.strokeRect(x, y0 - s, s, s);
    text('m', x + s / 2, y0 - s / 2 + 2, {size: 80, weight: 700, color: p.fg, align: 'center', base: 'middle'});
    const fl = Math.min((160 + 200 * ease(u / .35)) * (1 + .15 * k), x - r.x - 20);
    arrow(x - fl - 10, y0 - s / 2, x - 10, y0 - s / 2, p.volt, 9, 32, true); text('F', x - fl / 2 - 10, y0 - s / 2 - 44, {size: 60, weight: 700, color: p.volt, align: 'center'});
    if (u > .3) { const al = 200 * ease((u - .3) / .3); arrow(x + s / 2, y0 - s - 50, x + s / 2 + al, y0 - s - 50, p.amp, 6, 24, true); text('a', x + s / 2 + al + 34, y0 - s - 34, {size: 54, weight: 700, color: p.amp}); }
  },
  /* Arbeit */
  (t, u, p, r) => {
    const y0 = r.y + r.h * .7, x0 = r.x + 60, s = 170, weg = 580 * easeIO(u);
    ctx.fillStyle = p.volt; ctx.globalAlpha = .22; ctx.fillRect(x0 + s, y0 - 240, weg, 240); ctx.globalAlpha = 1;
    ctx.strokeStyle = p.muted; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(r.x, y0); ctx.lineTo(r.x + r.w, y0); ctx.stroke();
    const x = x0 + weg;
    ctx.fillStyle = p.card; ctx.fillRect(x, y0 - s, s, s); ctx.strokeStyle = p.fg; ctx.lineWidth = 4; ctx.strokeRect(x, y0 - s, s, s); text('m', x + s / 2, y0 - s / 2 + 2, {size: 64, weight: 700, color: p.fg, align: 'center', base: 'middle'});
    arrow(x - 190, y0 - s / 2, x - 10, y0 - s / 2, p.volt, 8, 30, true); text('F', x - 110, y0 - s / 2 - 36, {size: 54, weight: 700, color: p.volt, align: 'center'});
    ctx.strokeStyle = p.fg; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0 + s, y0 + 60); ctx.lineTo(x0 + s + weg, y0 + 60); ctx.moveTo(x0 + s, y0 + 44); ctx.lineTo(x0 + s, y0 + 76); ctx.moveTo(x0 + s + weg, y0 + 44); ctx.lineTo(x0 + s + weg, y0 + 76); ctx.stroke();
    text('s', x0 + s + weg / 2, y0 + 120, {size: 54, weight: 700, color: p.fg, align: 'center'});
    if (u > .5) { ctx.globalAlpha = ease((u - .5) / .25); text('Fläche = Arbeit', x0 + s + weg / 2, y0 - 270, {size: 34, weight: 700, color: p.volt, align: 'center', base: 'middle'}); ctx.globalAlpha = 1; }
  },
  /* Ladung: ein Blip, ein Elektron */
  (t, u, p, r) => {
    const n = D.blip.filter(b => b <= t + 1e-3).length;
    for (let i = 0; i < 16; i++) {
      const x = r.x + 70 + (i % 8) * 118, y = r.y + 150 + Math.floor(i / 8) * 220;
      if (i >= n) { ctx.strokeStyle = p.line; ctx.lineWidth = 2; ctx.setLineDash([4, 8]); ctx.beginPath(); ctx.arc(x, y, 40, 0, zpi); ctx.stroke(); ctx.setLineDash([]); continue; }
      const dt = t - D.blip[i], s = pop(dt / .25);
      glow(p.amp, dt < .3 ? 60 * (1 - dt / .3) + 14 : 14); ctx.fillStyle = p.amp; ctx.beginPath(); ctx.arc(x, y, 40 * s, 0, zpi); ctx.fill(); noglow();
      text('−', x, y + 2, {size: 48, weight: 700, color: INK, align: 'center', base: 'middle'});
    }
    text(`n = ${n}`, r.x + 60, r.y + r.h - 40, {size: 84, weight: 700, color: p.fg});
    text('· e', r.x + 60 + textW(`n = ${n}`, 84, 700) + 20, r.y + r.h - 40, {size: 84, weight: 700, color: p.amp});
  },
  /* Feld */
  (t, u, p, r) => {
    const xl = r.x + 60, xr = r.x + r.w - 60, yt = r.y + 20, yb = r.y + r.h - 20;
    glow(p.volt, 20); ctx.fillStyle = p.volt; ctx.fillRect(xl - 18, yt, 18, yb - yt); glow(p.amp, 20); ctx.fillStyle = p.amp; ctx.fillRect(xr, yt, 18, yb - yt); noglow();
    text('+', xl - 60, yt + 40, {size: 54, weight: 700, color: p.volt, align: 'center'}); text('−', xr + 60, yt + 40, {size: 54, weight: 700, color: p.amp, align: 'center'});
    for (let i = 0; i < 7; i++) { const y = yt + 50 + i * (yb - yt - 100) / 6, a = ease((u - i * .04) / .3); if (a <= 0) continue; ctx.globalAlpha = .5; arrow(xl + 14, y, xl + (xr - xl - 50) * a, y, p.fg, 2.5, 16); ctx.globalAlpha = 1; }
    const qx = (xl + xr) / 2 - 40, qy = (yt + yb) / 2, k = kickEnv(t);
    ctx.fillStyle = p.card; ctx.beginPath(); ctx.arc(qx, qy, 46, 0, zpi); ctx.fill(); glow(p.amp, 18); ctx.strokeStyle = p.amp; ctx.lineWidth = 5; ctx.stroke(); noglow(); text('q', qx, qy + 2, {size: 48, weight: 700, color: p.amp, align: 'center', base: 'middle'});
    if (u > .4) { const fl = (160 + 80 * ease((u - .4) / .3)) * (1 + .12 * k); arrow(qx + 54, qy, qx + 54 + fl, qy, p.volt, 9, 32, true); text('F', qx + 54 + fl / 2, qy - 56, {size: 54, weight: 700, color: p.volt, align: 'center'}); }
  },
  /* Potential */
  (t, u, p, r) => {
    const x0 = r.x + 80, x1 = r.x + r.w - 40, y0 = r.y + r.h - 60, yT = r.y + 30;
    ctx.strokeStyle = p.muted; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0, yT); ctx.lineTo(x0, y0); ctx.lineTo(x1, y0); ctx.stroke();
    text('φ', x0 - 44, yT + 24, {size: 46, weight: 700, color: p.volt}); text('x', x1 - 10, y0 + 50, {size: 38, weight: 700, color: p.fg});
    const prof = s => yT + 60 + (y0 - yT - 120) * (1 - Math.exp(-3 * s)) / (1 - Math.exp(-3));
    glow(p.volt, 18); ctx.strokeStyle = p.volt; ctx.lineWidth = 6; ctx.beginPath(); for (let i = 0; i <= 100; i++) { const s = i / 100, x = x0 + (x1 - x0 - 40) * s, y = prof(s); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); noglow();
    const s = easeIn(clamp(u / .85)), bx = x0 + (x1 - x0 - 40) * s, by = prof(s) - 38;
    dashed(bx, by + 38, bx, y0, p.muted, 2); dashed(x0, by + 38, bx, by + 38, p.muted, 2);
    dot(bx, by, 36, p.amp); text('+', bx, by + 2, {size: 44, weight: 700, color: INK, align: 'center', base: 'middle'});
    const phi = 5 - 4.4 * (1 - Math.exp(-3 * s)) / (1 - Math.exp(-3));
    text(`φ = ${phi.toFixed(1).replace('.', ',')} V`, x0 + 30, by + 26, {size: 40, weight: 700, color: p.volt});
  },
  /* Spannung */
  (t, u, p, r) => {
    const y1 = r.y + 80, y2 = r.y + r.h - 80, xm = r.x + r.w / 2, k = kickEnv(t);
    for (const [y, v, i] of [[y1, '5 V', '1'], [y2, '2 V', '2']]) {
      glow(p.volt, 18); ctx.strokeStyle = p.volt; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(r.x + 40, y); ctx.lineTo(r.x + r.w - 40, y); ctx.stroke(); noglow();
      text('φ', r.x + 50, y - 26, {size: 46, weight: 700, color: p.volt}); text(i, r.x + 80, y - 12, {size: 26, weight: 700, color: p.volt}); text(`= ${v}`, r.x + 112, y - 26, {size: 46, weight: 700, color: p.fg});
    }
    const a = ease(u / .4), ym = (y1 + y2) / 2, half = (y2 - y1) / 2 * a;
    arrow(xm, ym, xm, ym - half + 6, p.fg, 7, 26); arrow(xm, ym, xm, ym + half - 6, p.fg, 7, 26);
    ctx.save(); ctx.translate(xm + 70, ym); ctx.scale(1 + .07 * k, 1 + .07 * k); glow(p.fg, 10); text('U = 3 V', 0, 20, {size: 70, weight: 700, color: p.fg}); noglow(); ctx.restore();
  },
  /* Strom: eine Ladung je Arpeggio-Note */
  (t, u, p, r) => {
    const yw = r.y + r.h * .45, hw = 260, xa = r.x, xb = r.x + r.w, xq = r.x + r.w / 2;
    ctx.fillStyle = p.card; ctx.fillRect(xa, yw - hw / 2, xb - xa, hw); ctx.strokeStyle = p.fg; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(xa, yw - hw / 2); ctx.lineTo(xb, yw - hw / 2); ctx.moveTo(xa, yw + hw / 2); ctx.lineTo(xb, yw + hw / 2); ctx.stroke();
    dashed(xq, yw - hw / 2 - 50, xq, yw + hw / 2 + 50, p.volt, 4, [12, 10]); text('A', xq + 18, yw - hw / 2 - 60, {size: 40, weight: 700, color: p.volt});
    const T = 1.6;
    for (const e of D.arp) { const dt = t - e.t; if (dt < 0 || dt > T) continue; const x = xa + 30 + (xb - xa - 60) * dt / T, y = yw - 80 + (e.row % 4) * 54;
      dot(x, y, 22, p.amp); text('−', x, y + 1, {size: 28, weight: 700, color: p.bg, align: 'center', base: 'middle'}); }
    const n = D.arp.filter(e => e.t <= t && e.t >= sec(9)).length;
    text(`${n}`, r.x + 40, r.y + r.h - 40, {size: 84, weight: 700, color: p.amp}); text('durch A', r.x + 40 + textW(`${n}`, 84, 700) + 24, r.y + r.h - 40, {size: 40, weight: 700, color: p.fg});
    text('→ Elektronen', r.x + r.w - 40, r.y + r.h - 40, {size: 30, color: p.muted, align: 'right'});
  },
  /* Widerstand: Drude */
  (t, u, p, r) => {
    const cols = 7, rows = 5, gx = r.x + 90, gy = r.y + 40, dx = (r.w - 180) / (cols - 1), dy = (r.h - 200) / (rows - 1);
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) { ctx.strokeStyle = p.fg; ctx.lineWidth = 2; ctx.globalAlpha = .7; ctx.beginPath(); ctx.arc(gx + i * dx, gy + j * dy, 18, 0, zpi); ctx.stroke(); ctx.globalAlpha = 1; text('+', gx + i * dx, gy + j * dy + 1, {size: 22, weight: 700, color: p.fg, align: 'center', base: 'middle'}); }
    const pts = [[6.5, 2], [5.9, .6], [5.2, 3.3], [4.4, 1.5], [3.7, 3.8], [3.0, 2.1], [2.3, .5], [1.6, 2.9], [.9, 1.3], [.2, 3.5]];
    const seg = clamp(u) * (pts.length - 1), i0 = Math.min(pts.length - 2, Math.floor(seg)), f = seg - i0;
    glow(p.amp, 16); ctx.strokeStyle = p.amp; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.beginPath();
    for (let i = 0; i <= i0; i++) { const x = gx + pts[i][0] * dx, y = gy + pts[i][1] * dy; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    const ex = gx + lerp(pts[i0][0], pts[i0 + 1][0], f) * dx, ey = gy + lerp(pts[i0][1], pts[i0 + 1][1], f) * dy; ctx.lineTo(ex, ey); ctx.stroke(); noglow();
    dot(ex, ey, 24, p.amp);
    arrow(r.x + 60, r.y + r.h - 60, r.x + 320, r.y + r.h - 60, p.volt, 6, 24, true); text('E', r.x + 345, r.y + r.h - 46, {size: 44, weight: 700, color: p.volt});
    arrow(r.x + r.w - 60, r.y + r.h - 60, r.x + r.w - 320, r.y + r.h - 60, p.amp, 6, 24, true); text('Drift', r.x + r.w - 345, r.y + r.h - 46, {size: 38, weight: 700, color: p.amp, align: 'right'});
  }
];

/* ---------- Szenen ---------- */
function prolog(t) {
  const p = PAL.ink; bg(INK); textur(p, t);
  ctx.save(); kamera(t, 0, sec(3));
  brand(p);
  eyebrow('Grundlagen / 001 · Von Newton bis Ohm', 80, 400, p);
  textWrite('Acht Größen.', 80, 580, 118, CHALK, (t - .2) / 1.0);
  textWrite('Eine Kette.', 80, 710, 118, KUPFER, (t - sec(2)) / 1.0);
  kette(t, p, {sichtbar: i => ease((t - sec(1, i * .5) - .1) / .3), gefuellt: false});
  if (t > sec(2, 2)) { ctx.globalAlpha = ease((t - sec(2, 2)) / .4); text('Jede Größe folgt aus der vorigen.', 80, 1560, {size: 28, color: MUTED}); ctx.globalAlpha = 1; }
  ctx.restore();
  welle(p, t); haut(p, t);
}
function schritt(i, t) {
  const g = GROESSEN[i], p = PAL[g.bg], t0 = sec(3 + i), u = (t - t0) / D.bar, k = kickEnv(t), oben = i % 2 === 0;
  bg(p.bg); textur(p, t);
  /* Bereich des Diagramms und des Textes wechseln sich ab */
  const r = oben ? {x: 60, y: 880, w: 960, h: 660} : {x: 60, y: 380, w: 960, h: 640};
  const ty = oben ? 0 : 700;   // Versatz des Textblocks
  ctx.save(); kamera(t, t0, D.bar);
  DIAGRAMME[i](t, u, p, r);
  /* Textblock: Label, Wort, Formel, Satz */
  eyebrow(`${String(i + 1).padStart(2, '0')} / ${g.name}`, 80, 380 + ty, p);
  const size = Math.min(150, 920 / textW(g.name + '.', 1, 700, -.06));
  slam(g.name + '.', 80, 560 + ty + (150 - size) * .5, size, p.fg, t, t0 + .02);
  const tokens = g.f(p), fw = fmlWidth(tokens, 112);
  const punch = 1 + .1 * (1 - ease((t - t0 - 2 * D.beat) / .18)) * (t >= t0 + 2 * D.beat ? 1 : 0) + .02 * k;
  ctx.save(); ctx.translate(80, 720 + ty); ctx.scale(punch, punch); fmlWrite(tokens, 0, 0, 112, p.fg, (t - t0 - .12) / .75, p.volt);
  if (t >= t0 + 2 * D.beat) { ctx.globalAlpha = ease((t - t0 - 2 * D.beat) / .2); text(`[${g.unit}]`, fw + 40, 0, {size: 54, weight: 700, color: p.muted}); ctx.globalAlpha = 1; }
  ctx.restore();
  if (t >= t0 + 3 * D.beat) { ctx.globalAlpha = ease((t - t0 - 3 * D.beat) / .2); text(g.satz, 80, 810 + ty, {size: 28, color: p.muted}); ctx.globalAlpha = 1; }
  ctx.restore();
  fortschritt(i, p, t);
  welle(p, t, oben ? 1700 : 1700); haut(p, t);
}
function synthese(t) {
  const p = PAL.ink; bg(INK); textur(p, t);
  const impact = clamp(1 - (t - sec(11)) / .25), zoom = easeIO((t - sec(12, 3)) / .5);
  ctx.save();
  if (zoom > 0) { const s = 1 + .1 * zoom; ctx.translate(420, 1560); ctx.scale(s, s); ctx.translate(-420, -1560); }
  kamera(t, sec(11), 2 * D.bar);
  brand(p);
  eyebrow('Alles auf einen Blick', 80, 400, p);
  slam('Acht Schritte.', 80, 560, 112, CHALK, t, sec(11) + .02);
  if (t >= sec(12)) slam('Ein Gesetz.', 80, 690, 112, KUPFER, t, sec(12));
  kette(t, p, {sichtbar: i => ease((t - sec(11, i * .5)) / .25), gefuellt: true, laufen: t >= sec(12)});
  if (t >= sec(12)) {
    const w1 = ease((t - sec(12)) / .5), m = easeIO((t - sec(12, 2)) / .45), punch = 1 + .04 * kickEnv(t);
    const size = 120, y = 1620, x = 80;
    const A = {R: [0, 0], '=': [size * .72, 0], U: [size * 1.5, -size * .42], I: [size * 1.5, size * .72], bar: [size * 1.42, -size * .3, size * .9]};
    const B = {U: [0, 0], '=': [size * .72, 0], R: [size * 1.5, 0], '·': [size * 2.2, 0], I: [size * 2.7, 0]};
    ctx.save(); ctx.translate(x, y); ctx.scale(punch, punch);
    ctx.save(); ctx.beginPath(); ctx.rect(-10, -size * 1.4, 760 * w1 + 10, size * 2.8); ctx.clip();
    for (const [g, c] of [['R', CHALK], ['=', CHALK], ['U', KUPFER], ['I', AMP]]) { const a = A[g], b = B[g]; const s = g === 'U' || g === 'I' ? lerp(size * .78, size, m) : size; if (c !== CHALK) glow(c, 16); text(g, lerp(a[0], b[0], m), lerp(a[1], b[1], m), {size: s, weight: 700, color: c, ls: -size * .04}); noglow(); }
    ctx.globalAlpha = 1 - m; ctx.fillStyle = CHALK; ctx.fillRect(A.bar[0], A.bar[1], A.bar[2], 6); ctx.globalAlpha = m; text('·', B['·'][0], 0, {size, weight: 700, color: CHALK}); ctx.globalAlpha = 1;
    ctx.restore(); ctx.restore();
    if (w1 < 1) { glow(KUPFER, 26); ctx.fillStyle = KUPFER; ctx.beginPath(); ctx.arc(x + 400 * w1, y - 40, 12, 0, zpi); ctx.fill(); noglow(); }
    if (m >= 1) text('Newton plus Stöße im Draht.', 1000, 1620, {size: 26, color: MUTED, align: 'right'});
  }
  ctx.restore();
  if (impact > 0) { ctx.fillStyle = `rgba(239,236,226,${impact * .5})`; ctx.fillRect(0, 0, W, H); }
  if (zoom <= 0) welle(p, t); haut(p, t);
}
function outro(t) {
  const p = PAL.chalk; bg(CHALK); textur(p, t);
  ctx.save(); kamera(t, sec(13), 2 * D.bar + 2);
  brand(p);
  eyebrow('Merke', 80, 400, p);
  const bx = 80, by = 470, bw = 920, bh = 470;
  ctx.fillStyle = INK; ctx.fillRect(bx, by, bw, bh);
  const zeilen = [['Kraft mal Weg ist ', 'Arbeit.'], ['Arbeit pro Ladung ist ', 'Spannung.'], ['Ladung pro Zeit ist ', 'Strom.'], ['Newton plus Stöße: ', 'U = R · I']];
  zeilen.forEach(([a, b], i) => { const al = ease((t - sec(13, i)) / .22); if (al <= 0) return; ctx.globalAlpha = al; const y = by + 96 + i * 92; text(a, bx + 40 + (1 - al) * 30, y, {size: 34, weight: 700, color: CHALK}); if (i === 3) glow(KUPFER, 14); text(b, bx + 40 + (1 - al) * 30 + textW(a, 34, 700), y, {size: 34, weight: 700, color: i === 3 ? KUPFER : CHALK}); noglow(); ctx.globalAlpha = 1; });
  const a = ease((t - sec(14)) / .3);
  if (a > 0) {
    const x = 92 + (1 - a) * 500, y = 1000, w = 896, h = 250;
    ctx.fillStyle = PAPIER; ctx.fillRect(x, y, w, h); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
    ctx.fillStyle = INK; for (let q = y + 14; q < y + h - 14; q += 24) { ctx.fillRect(x - 13, q, 12, 7); ctx.fillRect(x + w + 1, q, 12, 7); }
    const cw = 330; ctx.fillStyle = INK; ctx.fillRect(x + 2, y + 2, cw, h - 4);
    ctx.save(); ctx.beginPath(); ctx.rect(x + 2, y + 2, cw, h - 4); ctx.clip(); glow(KUPFER, 12); lissajous(x + 2 + cw / 2, y + h / 2, 190, 2.4, KUPFER, 3, 2, t * 1.2); noglow(); ctx.restore();
    ctx.fillStyle = CHALK; ctx.fillRect(x + 16, y + 16, textW('THEORIE', 17, 700, 1) + 20, 30); text('THEORIE', x + 26, y + 32, {size: 17, weight: 700, color: INK, base: 'middle', ls: 1});
    text('N°005 · GRUNDLAGEN DER E-TECHNIK', x + cw + 28, y + 50, {size: 16, color: MUTED_HELL, ls: 1});
    text('Von Newton bis Ohm', x + cw + 28, y + 110, {size: 38, weight: 700, color: INK, ls: -1.3});
    text('Acht Größen, eine Kette — hergeleitet.', x + cw + 28, y + 152, {size: 22, color: MUTED_HELL});
    let tx = x + cw + 28; for (const tag of ['Herleitung', 'Potential', 'Drude']) { const tw = textW(tag, 17) + 20; ctx.strokeStyle = '#bdb9aa'; ctx.lineWidth = 1.5; ctx.strokeRect(tx, y + 186, tw, 34); text(tag, tx + 10, y + 204, {size: 17, color: MUTED_HELL, base: 'middle'}); tx += tw + 10; }
  }
  const c = ease((t - sec(14, 1)) / .3);
  if (c > 0) {
    ctx.globalAlpha = c;
    knopf('br1ken.github.io', 180, 1330, 720, 86, KUPFER_HELL, KUPFER_HELL, INK, 34);
    knopf('Link in Bio ↗', 180, 1440, 720, 86, null, INK, INK, 30);
    const e = 'Ein Labor von Brick · TU Wien', ew = textW(e.toUpperCase(), 22, 700, 1) + 40; eyebrow(e, (W - ew) / 2, 1580, p);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  haut(p, t);
}

function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.setLineDash([]); ctx.shadowBlur = 0;
  if (t < sec(3)) prolog(t);
  else if (t < sec(11)) schritt(Math.min(7, Math.floor((t - sec(3)) / D.bar)), t);
  else if (t < sec(13)) synthese(t);
  else outro(t);
  /* Schnitt: eine Kupfer-Linie tastet den Schirm ab */
  for (let b = 3; b <= 13; b++) { const dt = t - sec(b); if (dt >= 0 && dt < .1) { glow(KUPFER, 20); ctx.fillStyle = KUPFER; ctx.fillRect(0, H * dt / .1 - 3, W, 6); noglow(); } }
}
async function reelInit() {
  await Promise.all([document.fonts.load('700 20px Meslo'), document.fonts.load('400 20px Meslo')]);
  D = window.REEL;
  for (const k in D.sig) { const b = atob(D.sig[k]); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); D.sig[k] = new Int16Array(u.buffer); }
  return D.rms.length;
}
window.renderFrame = renderFrame; window.reelInit = reelInit;
